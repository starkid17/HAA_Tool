<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deriv Public Digit Match Analyzer</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0e1117; color: #fff; padding: 15px; margin: 0; }
        h2 { color: #3498db; font-size: 20px; text-align: center; }
        .card { background: #1f242d; padding: 15px; border-radius: 8px; margin-bottom: 15px; }
        label { display: block; margin-top: 10px; font-size: 14px; color: #aaa; }
        select { width: 100%; padding: 10px; margin-top: 5px; background: #2b323c; border: 1px solid #444; color: #fff; border-radius: 4px; box-sizing: border-box; }
        .btn-group { display: flex; gap: 10px; margin-top: 15px; }
        button { flex: 1; padding: 12px; font-weight: bold; border-radius: 4px; cursor: pointer; border: none; }
        .btn-start { background: #2ecc71; color: #fff; }
        .btn-start:hover { background: #27ae60; }
        .btn-stop { background: #e74c3c; color: #fff; }
        .btn-stop:hover { background: #c0392b; }
        .log-box { background: #000; padding: 10px; font-family: monospace; font-size: 12px; height: 160px; overflow-y: scroll; border-radius: 4px; border: 1px solid #333; }
        .signal-box { background: #1b263b; border-left: 4px solid #3498db; padding: 12px; margin-top: 10px; border-radius: 4px; }
        .accuracy { font-size: 18px; color: #f1c40f; font-weight: bold; }
    </style>
</head>
<body>

    <h2>Public Digit Match Analyzer (No Login Needed)</h2>

    <div class="card">
        <label>Select Volatility Market / Symbol</label>
        <select id="symbol">
            <option value="R_100">Volatility 100 Index</option>
            <option value="R_75">Volatility 75 Index</option>
            <option value="R_50">Volatility 50 Index</option>
            <option value="R_25">Volatility 25 Index</option>
            <option value="R_10">Volatility 10 Index</option>
            <option value="1HZ100V">1-Second Volatility 100</option>
            <option value="1HZ50V">1-Second Volatility 50</option>
        </select>

        <div class="btn-group">
            <button class="btn-start" onclick="startAnalysis()">Run Analysis</button>
            <button class="btn-stop" onclick="stopAnalysis()">Stop Analysis</button>
        </div>
    </div>

    <div class="card">
        <h3>Live Market Intelligence</h3>
        <div id="statusText">Status: Idle. Select a market and click Run.</div>
        
        <div class="signal-box" id="signalDisplay" style="display:none;">
            <div>Target Match Prediction: <span id="targetDigit" style="font-size: 22px; color: #2ecc71; font-weight: bold;">-</span></div>
            <div>Confidence / Accuracy Score: <span id="accuracyScore" class="accuracy">-</span></div>
            <div style="font-size: 12px; color: #aaa; margin-top: 5px;" id="sampleStatus">Collecting ticks... (0/100)</div>
        </div>
        <br>
        <div class="log-box" id="logBox">System ready...</div>
    </div>

<script>
let ws = null;
let recentDigits = [];
const SAMPLE_SIZE = 100;
let isAnalyzing = false;

function log(msg) {
    const box = document.getElementById('logBox');
    box.innerHTML += `<div>[${new Date().toLocaleTimeString()}] ${msg}</div>`;
    box.scrollTop = box.scrollHeight;
}

function startAnalysis() {
    if (isAnalyzing) return;
    
    const symbol = document.getElementById('symbol').value;
    recentDigits = [];
    isAnalyzing = true;
    
    document.getElementById('statusText').innerText = `Status: Connecting to public stream for ${symbol}...`;
    document.getElementById('signalDisplay').style.display = 'block';
    log(`Initializing analysis stream on ${symbol}...`);

    // Public API Endpoint (No App ID restriction or token needed for basic tick feeds)
    ws = new WebSocket(`wss://ws.derivws.com/websockets/v3?app_id=1089`);

    ws.onopen = () => {
        log("Connected to public websocket data feed.");
        document.getElementById('statusText').innerText = `Status: Streaming data for ${symbol}`;
        // Subscribe to public ticks
        ws.send(JSON.stringify({ ticks: symbol, subscribe: 1 }));
    };

    ws.onmessage = (event) => {
        const data = JSON.parse(event.data);

        if (data.msg_type === 'tick') {
            const quote = String(data.tick.quote);
            const lastDigit = parseInt(quote.slice(-1));
            
            recentDigits.push(lastDigit);
            if (recentDigits.length > SAMPLE_SIZE) {
                recentDigits.shift();
            }

            document.getElementById('sampleStatus').innerText = `Sample Window Progress: ${recentDigits.length}/${SAMPLE_SIZE} ticks`;

            if (recentDigits.length === SAMPLE_SIZE) {
                let counts = Array(10).fill(0);
                recentDigits.forEach(d => counts[d]++);

                let maxCount = Math.max(...counts);
                let hotDigit = counts.indexOf(maxCount);
                let percentage = (maxCount / SAMPLE_SIZE) * 100;

                // Accuracy / Confidence Calculation Formula
                // Baseline random expectation is 10%. Higher deviation represents confidence edge.
                let deviation = percentage - 10.0;
                let calculatedAccuracy = Math.min(95, Math.max(45, 50 + (deviation * 3.5))).toFixed(1);

                document.getElementById('targetDigit').innerText = `Digit [ ${hotDigit} ] (Hit frequency: ${percentage.toFixed(1)}%)`;
                document.getElementById('accuracyScore').innerText = `${calculatedAccuracy}% (Based on ${percentage.toFixed(1)}% frequency surge)`;

                if (percentage >= 13.0) {
                    log(`[STRONG SIGNAL] Digit ${hotDigit} hit ${percentage}% frequency. Recommended for 2-tick Match execution on your trading device.`);
                }
            }
        }
    };

    ws.onerror = (err) => {
        log("WebSocket Error encountered.");
    };

    ws.onclose = () => {
        log("WebSocket stream closed.");
    };
}

function stopAnalysis() {
    if (ws) {
        ws.close();
    }
    isAnalyzing = false;
    document.getElementById('statusText').innerText = "Status: Stopped.";
    log("Analysis stopped by user.");
}
</script>

</body>
</html>
